apiVersion: apps/v1
kind: Deployment
metadata:
  name: uim-services
  labels:
    app: uim-services
spec:
  replicas: 2
  selector:
    matchLabels:
      app: uim-services
  template:
    metadata:
      labels:
        app: uim-services
    spec:
      containers:
      - name: uim-services
        image: ghcr.io/uimsolutions/uim-services:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: HOST
          value: "0.0.0.0"
        - name: PORT
          value: "8080"
        - name: BASE_PATH
          value: "/api/v1"
        - name: SERVICE_NAME
          value: "uim-services"
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: uim-services
  labels:
    app: uim-services
spec:
  type: ClusterIP
  selector:
    app: uim-services
  ports:
  - name: http
    port: 80
    targetPort: 8080
